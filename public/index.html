<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copa das Federações - Bahia Beach Tennis</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.0/axios.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px 30px;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .header-left h1 {
            font-size: 2.2em;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header-left p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .header-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .header-right small {
            font-size: 0.8em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .login-form {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .login-form h2 {
            text-align: center;
            color: #2a5298;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 239, 125, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
            margin-top: 10px;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(235, 51, 73, 0.4);
        }

        .btn-small {
            width: auto;
            padding: 8px 16px;
            font-size: 14px;
            display: inline-block;
            margin: 5px;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .info-message {
            background: #d1ecf1;
            color: #0c5460;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #bee5eb;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 12px 24px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab:hover {
            color: #667eea;
        }

        .game-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }

        .game-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .game-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .game-card-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #2a5298;
        }

        .category-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .game-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .game-info-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .game-info-label {
            font-weight: 600;
            color: #666;
        }

        .game-info-value {
            color: #333;
        }

        .result-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .result-title {
            font-weight: 700;
            color: #2a5298;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .match-result {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .match-type {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
        }

        .players {
            color: #333;
            font-size: 0.95em;
        }

        .score {
            font-size: 1.2em;
            font-weight: 700;
            color: #2a5298;
            margin-top: 5px;
        }

        .score.win {
            color: #11998e;
        }

        .score.loss {
            color: #eb3349;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            color: #2a5298;
        }

        .close-btn {
            font-size: 28px;
            cursor: pointer;
            color: #666;
            background: none;
            border: none;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: #eb3349;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .empty-state-text {
            font-size: 1.2em;
        }

        .filter-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .player-select-group {
            margin-bottom: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .player-select-group h4 {
            color: #2a5298;
            margin-bottom: 10px;
        }

        .result-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .result-badge.vitoria {
            background: #d4edda;
            color: #155724;
        }

        .result-badge.derrota {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        @media (max-width: 768px) {
            .header-inner {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-right {
                align-items: flex-start;
                text-align: left;
            }

            .header-left h1 {
                font-size: 1.8em;
            }

            .header-left p {
                font-size: 1em;
            }

            .content {
                padding: 20px;
            }

            .game-info {
                grid-template-columns: 1fr;
            }

            .tabs {
                overflow-x: auto;
                flex-wrap: nowrap;
            }

            .tab {
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const API_URL = window.location.origin;

        const CATEGORIAS = [
            'sub 12', 'sub 14', 'sub 16', 'sub 18',
            '40+', '50+', '60+', 'PRO', 'A', 'B', 'C'
        ];

        const ESTADOS = [
            'Acre', 'Alagoas', 'Amapá', 'Amazonas', 'Bahia', 'Ceará',
            'Distrito Federal', 'Espírito Santo', 'Goiás', 'Maranhão',
            'Mato Grosso', 'Mato Grosso do Sul', 'Minas Gerais', 'Pará',
            'Paraíba', 'Paraná', 'Pernambuco', 'Piauí', 'Rio de Janeiro',
            'Rio Grande do Norte', 'Rio Grande do Sul', 'Rondônia', 'Roraima',
            'Santa Catarina', 'São Paulo', 'Sergipe', 'Tocantins'
        ];

        // 🔹 NOVO: formata o confronto para exibir só "Bahia x Acre"
        const formatConfronto = (confronto) => {
            if (!confronto) return '';
            return confronto.split(' | ')[0];
        };

        // API
        const api = {
            login: async (username, password) => {
                const response = await axios.post(`${API_URL}/api/login`, { username, password });
                return response.data;
            },
            getAtletas: async () => {
                const response = await axios.get(`${API_URL}/api/atletas`);
                return response.data;
            },
            refreshAtletas: async () => {
                const response = await axios.post(`${API_URL}/api/atletas/refresh`);
                return response.data;
            },
            getJogos: async () => {
                const response = await axios.get(`${API_URL}/api/jogos`);
                return response.data;
            },
            criarJogo: async (jogo) => {
                const response = await axios.post(`${API_URL}/api/jogos`, jogo);
                return response.data;
            },
            atualizarJogo: async (id, jogo) => {
                const response = await axios.put(`${API_URL}/api/jogos/${id}`, jogo);
                return response.data;
            },
            excluirJogo: async (id) => {
                const response = await axios.delete(`${API_URL}/api/jogos/${id}`);
                return response.data;
            }
        };

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentUser, setCurrentUser] = useState('');
            const [activeTab, setActiveTab] = useState('proximos');
            const [jogos, setJogos] = useState([]);
            const [atletas, setAtletas] = useState([]);
            const [showModal, setShowModal] = useState(false);
            const [modalType, setModalType] = useState('');
            const [selectedGame, setSelectedGame] = useState(null);
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState(null);
            const [showLoginModal, setShowLoginModal] = useState(false);

            // Recuperar sessão do capitão (persistência após refresh)
            useEffect(() => {
                const saved = localStorage.getItem('capitaoSession');
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        if (data.user) {
                            setCurrentUser(data.user);
                            setIsLoggedIn(true);
                        }
                    } catch (e) {
                        console.error('Erro ao ler sessão do capitão:', e);
                    }
                }
            }, []);

            // Carregar jogos (sempre, público)
            useEffect(() => {
                carregarJogos();
            }, []);

            // Carregar atletas só quando capitão logar
            useEffect(() => {
                if (isLoggedIn) {
                    carregarAtletas();
                }
            }, [isLoggedIn]);

            const carregarJogos = async () => {
                setLoading(true);
                try {
                    const jogosData = await api.getJogos();
                    setJogos(jogosData);
                } catch (error) {
                    showMessage('Erro ao carregar jogos', 'error');
                    console.error(error);
                } finally {
                    setLoading(false);
                }
            };

            const carregarAtletas = async () => {
                try {
                    const atletasData = await api.getAtletas();
                    setAtletas(atletasData);
                } catch (error) {
                    showMessage('Erro ao carregar atletas', 'error');
                    console.error(error);
                }
            };

            const handleLogin = async (username, password) => {
                try {
                    const result = await api.login(username, password);
                    if (result.success) {
                        setIsLoggedIn(true);
                        setCurrentUser(username);
                        localStorage.setItem('capitaoSession', JSON.stringify({ user: username }));
                        showMessage('Login realizado com sucesso!', 'success');
                        return true;
                    }
                    return false;
                } catch (error) {
                    return false;
                }
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setCurrentUser('');
                localStorage.removeItem('capitaoSession');
                setActiveTab('proximos');
                showMessage('Você saiu da área de capitão.', 'info');
            };

            const abrirModal = (tipo, jogo = null) => {
                setModalType(tipo);
                setSelectedGame(jogo);
                setShowModal(true);
            };

            const fecharModal = () => {
                setShowModal(false);
                setModalType('');
                setSelectedGame(null);
            };

            const adicionarJogo = async (novoJogo) => {
                try {
                    const jogo = await api.criarJogo(novoJogo);
                    setJogos([...jogos, jogo]);
                    fecharModal();
                    showMessage('Jogo cadastrado com sucesso!', 'success');
                } catch (error) {
                    showMessage('Erro ao cadastrar jogo', 'error');
                    console.error(error);
                }
            };

            const atualizarResultado = async (jogoId, resultadoCompleto) => {
                try {
                    // monta resultadoFinal com base nas vitórias
                    const { feminino, masculino, mista } = resultadoCompleto || {};
                    let vitorias = 0;
                    if (feminino?.resultado === 'vitoria') vitorias++;
                    if (masculino?.resultado === 'vitoria') vitorias++;
                    if (mista?.resultado === 'vitoria') vitorias++;

                    const resultadoFinal = vitorias >= 2 ? 'vitoria' : 'derrota';

                    const jogoAtualizado = await api.atualizarJogo(jogoId, { 
                        resultado: resultadoCompleto,
                        resultadoFinal,
                        status: 'encerrado'
                    });

                    setJogos(jogos.map(jogo => 
                        jogo.id === jogoId ? jogoAtualizado : jogo
                    ));
                    fecharModal();
                    showMessage('Resultado atualizado com sucesso!', 'success');
                } catch (error) {
                    showMessage('Erro ao atualizar resultado', 'error');
                    console.error(error);
                }
            };

            const excluirJogo = async (jogoId) => {
                if (!confirm('Deseja realmente excluir este jogo?')) return;
                
                try {
                    await api.excluirJogo(jogoId);
                    setJogos(jogos.filter(jogo => jogo.id !== jogoId));
                    showMessage('Jogo excluído com sucesso!', 'success');
                } catch (error) {
                    showMessage('Erro ao excluir jogo', 'error');
                    console.error(error);
                }
            };

            const atualizarAtletas = async () => {
                try {
                    await api.refreshAtletas();
                    const atletasData = await api.getAtletas();
                    setAtletas(atletasData);
                    showMessage('Lista de atletas atualizada!', 'success');
                } catch (error) {
                    showMessage('Erro ao atualizar atletas', 'error');
                    console.error(error);
                }
            };

            const showMessage = (text, type) => {
                setMessage({ text, type });
                setTimeout(() => setMessage(null), 5000);
            };

            return (
                <div className="container">
                    <div className="header">
                        <div className="header-inner">
                            <div className="header-left">
                                <h1>🏖️ Copa das Federações 2025</h1>
                                <p>Equipe Bahia - Beach Tennis</p>
                            </div>
                            <div className="header-right">
                                {!isLoggedIn && (
                                    <>
                                        <span>Login apenas para capitães</span>
                                        <small>(cadastro e edição de jogos)</small>
                                        <button
                                            className="btn btn-secondary btn-small"
                                            style={{ marginTop: '6px' }}
                                            onClick={() => setShowLoginModal(true)}
                                        >
                                            🔐 Login Capitão
                                        </button>
                                    </>
                                )}
                                {isLoggedIn && (
                                    <>
                                        <span>👤 Capitão: {currentUser}</span>
                                        <button
                                            className="btn btn-secondary btn-small"
                                            style={{ marginTop: '6px' }}
                                            onClick={handleLogout}
                                        >
                                            Sair
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>
                    
                    <div className="content">
                        {message && (
                            <div className={
                                message.type === 'error' ? 'error-message' :
                                message.type === 'success' ? 'success-message' :
                                'info-message'
                            }>
                                {message.text}
                            </div>
                        )}

                        {loading && jogos.length === 0 && (
                            <div className="loading">Carregando dados</div>
                        )}

                        <div className="tabs">
                            <button 
                                className={`tab ${activeTab === 'proximos' ? 'active' : ''}`}
                                onClick={() => setActiveTab('proximos')}
                            >
                                Próximos Jogos
                            </button>
                            <button 
                                className={`tab ${activeTab === 'resultados' ? 'active' : ''}`}
                                onClick={() => setActiveTab('resultados')}
                            >
                                Resultados
                            </button>
                            {isLoggedIn && (
                                <button 
                                    className={`tab ${activeTab === 'atletas' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('atletas')}
                                >
                                    Atletas
                                </button>
                            )}
                        </div>

                        {activeTab === 'proximos' && (
                            <ProximosJogos 
                                jogos={jogos.filter(j => !j.resultado)}
                                onNovoJogo={isLoggedIn ? () => abrirModal('novoJogo') : null}
                                onEditarResultado={isLoggedIn ? (jogo) => abrirModal('resultado', jogo) : null}
                                onExcluir={isLoggedIn ? excluirJogo : null}
                                isCapitao={isLoggedIn}
                            />
                        )}

                        {activeTab === 'resultados' && (
                            <Resultados 
                                jogos={jogos.filter(j => j.resultado)}
                                onEditarResultado={isLoggedIn ? (jogo) => abrirModal('resultado', jogo) : null}
                                isCapitao={isLoggedIn}
                            />
                        )}

                        {activeTab === 'atletas' && isLoggedIn && (
                            <Atletas 
                                atletas={atletas}
                                onAtualizar={atualizarAtletas}
                            />
                        )}

                        <Modal 
                            show={showModal}
                            onClose={fecharModal}
                            tipo={modalType}
                            jogo={selectedGame}
                            onSalvarJogo={adicionarJogo}
                            onSalvarResultado={atualizarResultado}
                            atletas={atletas}
                            estados={ESTADOS}
                        />

                        <LoginModal
                            show={showLoginModal}
                            onClose={() => setShowLoginModal(false)}
                            onLogin={handleLogin}
                        />
                    </div>
                </div>
            );
        }

        // Próximos Jogos
        function ProximosJogos({ jogos, onNovoJogo, onEditarResultado, onExcluir, isCapitao }) {
            const [filtroCategoria, setFiltroCategoria] = useState('');

            const jogosFiltrados = filtroCategoria 
                ? jogos.filter(j => j.categoria === filtroCategoria)
                : jogos;

            return (
                <div>
                    <div className="filter-section">
                        <div className="filter-grid">
                            <div className="form-group">
                                <label>Filtrar por Categoria</label>
                                <select 
                                    value={filtroCategoria}
                                    onChange={(e) => setFiltroCategoria(e.target.value)}
                                >
                                    <option value="">Todas as categorias</option>
                                    {CATEGORIAS.map(cat => (
                                        <option key={cat} value={cat}>{cat}</option>
                                    ))}
                                </select>
                            </div>
                        </div>
                    </div>

                    {isCapitao && onNovoJogo && (
                        <button className="btn btn-success" onClick={onNovoJogo}>
                            ➕ Cadastrar Novo Jogo
                        </button>

        // Atletas (apenas capitão vê, pois a aba só aparece logado)

        // Modal de Jogos / Resultados
        function Modal({ show, onClose, tipo, jogo, onSalvarJogo, onSalvarResultado, atletas, estados }) {
            const [formData, setFormData] = useState({});

            useEffect(() => {
                if (tipo === 'resultado' && jogo) {
                    setFormData(jogo.resultado || {});
                } else if (tipo === 'novoJogo') {
                    setFormData({
                        categoria: '',
                        data: '',
                        horario: '',
                        estadoAdversario: '',
                        descricao: '',
                        confronto: 'Bahia x ',
                    });
                } else {
                    setFormData({});
                }
            }, [tipo, jogo]);

            if (!show) return null;

            const handleSubmit = (e) => {
                e.preventDefault();
                
                if (tipo === 'novoJogo') {
                    const estado = formData.estadoAdversario || '';
                    const confronto = `Bahia x ${estado}`;
                    onSalvarJogo({
                        ...formData,
                        confronto,
                    });
                } else if (tipo === 'resultado') {
                    onSalvarResultado(jogo.id, formData);
                }
                
                setFormData({});
            };

            const atletasDaCategoria = (genero) => {
                if (!jogo) return [];
                return atletas.filter(a => 
                    a.genero === genero && 
                    a.categorias.includes(jogo.categoria)
                );
            };

            // helpers para evitar escolher o mesmo atleta duas vezes
            const filtrarAtletas = (lista, selecionadoOutro) => {
                return lista.filter(a => a.nome !== selecionadoOutro);
            };

            // helpers para sets
            const getSets = (sub) => sub?.sets || [{bahia: '', adversario: ''}, {bahia: '', adversario: ''}, {bahia: '', adversario: ''}];

            const getSetLimits = (setIndex) => {
                // set 1 e 2 -> 0 a 7
                if (setIndex === 0 || setIndex === 1) {
                    return { min: 0, max: 7 };
                }
                // set 3 -> 0 a 10
                return { min: 0, max: 10 };
            };


            const updateSet = (subKey, setIndex, field, value) => {
                const atual = formData[subKey] || {};
                const sets = getSets(atual);

                const limits = getSetLimits(setIndex);

                let num = value === '' ? '' : parseInt(value, 10);

                if (num !== '' && !Number.isNaN(num)) {
                    if (num < limits.min) num = limits.min;
                    if (num > limits.max) num = limits.max;
                }

                const novosSets = sets.map((s, idx) => 
                    idx === setIndex ? { ...s, [field]: num === '' ? '' : String(num) } : s
                );

                setFormData({
                    ...formData,
                    [subKey]: {
                        ...atual,
                        sets: novosSets,
                        placar: montarPlacar(novosSets)
                    }
                });
            };


            const montarPlacar = (sets) => {
                const validSets = sets.filter(s => s.bahia || s.adversario);
                if (validSets.length === 0) return '';
                return validSets.map(s => `${s.bahia}x${s.adversario}`).join(', ');
            };

            return (
                <div className={`modal ${show ? 'active' : ''}`} onClick={onClose}>
                    <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <h2>
                                {tipo === 'novoJogo' && '➕ Novo Jogo'}
                                {tipo === 'resultado' && '📊 Registrar Resultado'}
                            </h2>
                            <button className="close-btn" onClick={onClose}>×</button>
                        </div>

                        <form onSubmit={handleSubmit}>
                            {tipo === 'novoJogo' && (
                                <>
                                    <div className="form-group">
                                        <label>Categoria *</label>
                                        <select 
                                            required
                                            value={formData.categoria || ''}
                                            onChange={(e) => setFormData({...formData, categoria: e.target.value})}
                                        >
                                            <option value="">Selecione...</option>
                                            {CATEGORIAS.map(cat => (
                                                <option key={cat} value={cat}>{cat}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="form-group">
                                        <label>Estado Adversário *</label>
                                        <select
                                            required
                                            value={formData.estadoAdversario || ''}
                                            onChange={(e) => {
                                                const estado = e.target.value;
                                                setFormData({
                                                    ...formData,
                                                    estadoAdversario: estado,
                                                });
                                            }}
                                        >
                                            <option value="">Selecione o estado...</option>
                                            {estados
                                                .filter(uf => uf !== 'Bahia')
                                                .map(uf => (
                                                    <option key={uf} value={uf}>{uf}</option>
                                                ))
                                            }
                                        </select>
                                    </div>

                                    <div className="form-group">
                                        <label>Data *</label>
                                        <input 
                                            type="date"
                                            required
                                            value={formData.data || ''}
                                            onChange={(e) => setFormData({...formData, data: e.target.value})}
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>Horário *</label>
                                        <input 
                                            type="time"
                                            required
                                            value={formData.horario || ''}
                                            onChange={(e) => setFormData({...formData, horario: e.target.value})}
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>Descrição / Fase do Confronto (opcional)</label>

                                            type="text"
                                            placeholder="Ex: Fase de grupos, Quartas de final, Final..."

                                            onChange={(e) => setFormData({...formData, descricao: e.target.value})}

                                                value={formData.feminino?.atletas?.[1] || ''}
                                                onChange={(e) => {

                                                        ...formData,

                                                            ...atual,

                                                }}
                                            >
                                                <option value="">Selecione...</option>
                                                {filtrarAtletas(
                                                    atletasDaCategoria('feminino'),
                                                    formData.feminino?.atletas?.[0] || ''

                                                    <option key={a.id} value={a.nome}>{a.nome}</option>
                                                ))}
                                            </select>

                                        <div className="form-group">

                                                            type="number"
                                                            placeholder="Bahia"
                                                            style={{ width: '70px' }}
                                                            min={limits.min}
                                                            max={limits.max}
                                                            value={set.bahia || ''}
                                                            onChange={(e) => updateSet('feminino', idx, 'bahia', e.target.value)}
                                                        />
                                                        <span>x</span>
                                                        <input
                                                            type="number"
                                                            placeholder="Adv."
                                                            style={{ width: '70px' }}
                                                            min={limits.min}
                                                            max={limits.max}
                                                            value={set.adversario || ''}
                                                            onChange={(e) => updateSet('feminino', idx, 'adversario', e.target.value)}
                                                        />
                                                    </div>
                                                );
                                            })}

                                        </div>

                                        <div className="form-group">
                                            <label>Resultado</label>
                                            <select
                                                value={formData.feminino?.resultado || ''}
                                                onChange={(e) => setFormData({
                                                    ...formData,
                                                    feminino: {
                                                        ...(formData.feminino || {}),
                                                        resultado: e.target.value
                                                    }
                                                })}
                                            >
                                                <option value="">Selecione...</option>
                                                <option value="vitoria">Vitória</option>
                                                <option value="derrota">Derrota</option>
                                            </select>
                                        </div>
                                    </div>

                                    {/* MASCULINO */}

                                                onChange={(e) => {
                                                    const atual = formData.masculino || {};
                                                    const at1 = atual.atletas?.[0] || '';
                                                    setFormData({

                                                        masculino: {

                                                        onChange={(e) => updateSet('masculino', idx, 'adversario', e.target.value)}
                                                    />
                                                </div>
                                            ))}
                                        </div>

                                        <div className="form-group">
                                            <label>Resultado</label>
                                            <select
                                                value={formData.masculino?.resultado || ''}
                                                onChange={(e) => setFormData({
                                                    ...formData,
                                                    masculino: {
                                                        ...(formData.masculino || {}),
                                                        resultado: e.target.value
                                                    }
                                                })}
                                            >
                                                <option value="">Selecione...</option>
                                                <option value="vitoria">Vitória</option>
                                                <option value="derrota">Derrota</option>
                                            </select>
                                        </div>
                                    </div>

                                    {/* MISTA */}
                                    <div className="player-select-group">
                                        <h4>👫 Dupla Mista (Opcional - Desempate)</h4>
                                        <div className="form-group">
                                            <label>Atleta Feminina</label>
                                            <select
                                                value={formData.mista?.atletas?.[0] || ''}
                                                onChange={(e) => {
                                                    const atual = formData.mista || {};
                                                    const at2 = atual.atletas?.[1] || '';
                                                    setFormData({
                                                        ...formData,
                                                        mista: {
                                                            ...atual,
                                                            atletas: [e.target.value, at2]
                                                        }
                                                    });
                                                }}
                                            >
                                                <option value="">Selecione...</option>
                                                {atletasDaCategoria('feminino').map(a => (
                                                    <option key={a.id} value={a.nome}>{a.nome}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div className="form-group">
                                            <label>Atleta Masculino</label>
                                            <select
                                                value={formData.mista?.atletas?.[1] || ''}
                                                onChange={(e) => {
                                                    const atual = formData.mista || {};
                                                    const at1 = atual.atletas?.[0] || '';
                                                    setFormData({
                                                        ...formData,
                                                        mista: {
                                                            ...atual,
                                                            atletas: [at1, e.target.value]
                                                        }
                                                    });
                                                }}
                                            >
                                                <option value="">Selecione...</option>
                                                {atletasDaCategoria('masculino').map(a => (
                                                    <option key={a.id} value={a.nome}>{a.nome}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="form-group">
                                            <label>Placar por Set</label>
                                            {getSets(formData.mista).map((set, idx) => (
                                                <div key={idx} style={{ display: 'flex', gap: '10px', marginBottom: '8px', alignItems: 'center' }}>
                                                    <span>Set {idx + 1}:</span>
                                                    <input
                                                        type="number"
                                                        placeholder="Bahia"
                                                        style={{ width: '70px' }}
                                                        min={getSetLimits(idx).min}
                                                        max={getSetLimits(idx).max}
                                                        value={set.bahia || ''}
                                                        onChange={(e) => updateSet('mista', idx, 'bahia', e.target.value)}
                                                    />
                                                    <span>x</span>
                                                    <input
                                                        type="number"
                                                        placeholder="Adv."
                                                        style={{ width: '70px' }}
                                                        min={getSetLimits(idx).min}
                                                        max={getSetLimits(idx).max}
                                                        value={set.adversario || ''}
                                                        onChange={(e) => updateSet('mista', idx, 'adversario', e.target.value)}
                                                    />
                                                </div>
                                            ))}
                                        </div>

                                        <div className="form-group">
                                            <label>Resultado</label>
                                            <select
                                                value={formData.mista?.resultado || ''}
                                                onChange={(e) => setFormData({
                                                    ...formData,
                                                    mista: {
                                                        ...(formData.mista || {}),
                                                        resultado: e.target.value
                                                    }
                                                })}
                                            >
                                                <option value="">Selecione...</option>
                                                <option value="vitoria">Vitória</option>
                                                <option value="derrota">Derrota</option>
                                            </select>
                                        </div>
                                    </div>
                                </>
                            )}

                            <button type="submit" className="btn btn-primary">
                                💾 Salvar
                            </button>
                            <button type="button" className="btn btn-secondary" onClick={onClose}>
                                ❌ Cancelar
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // Modal de Login de Capitão
        function LoginModal({ show, onClose, onLogin }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            if (!show) return null;

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');
                
                const success = await onLogin(username, password);
                
                if (!success) {
                    setError('Usuário ou senha incorretos');
                } else {
                    onClose();
                }
                setLoading(false);
            };

            return (
                <div className={`modal ${show ? 'active' : ''}`} onClick={onClose}>
                    <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <h2>Login de Capitão</h2>
                            <button className="close-btn" onClick={onClose}>×</button>
                        </div>
                        <form onSubmit={handleSubmit} className="login-form">
                            {error && <div className="error-message">{error}</div>}
                            <div className="form-group">
                                <label>Usuário</label>
                                <input 
                                    type="text" 
                                    value={username}
                                    onChange={(e) => setUsername(e.target.value)}
                                    disabled={loading}
                                    required
                                />
                            </div>
                            <div className="form-group">
                                <label>Senha</label>
                                <input 
                                    type="password" 
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    disabled={loading}
                                    required
                                />
                            </div>
                            <button type="submit" className="btn btn-primary" disabled={loading}>
                                {loading ? 'Entrando...' : 'Entrar'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
